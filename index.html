<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ملعب الهمزات مع البطل عمر</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:Cairo,"Segoe UI",Tahoma,sans-serif;font-weight:800;color:#15361f;background:repeating-linear-gradient(0deg,#2e9e4a 0 70px,#38b457 70px 140px) fixed;overflow-x:hidden;user-select:none;-webkit-user-select:none}
#stands{position:fixed;top:0;left:0;right:0;height:34px;background:#2b2f4a;font-size:22px;white-space:nowrap;overflow:hidden;z-index:5;text-align:center;line-height:34px}
#app{max-width:600px;margin:0 auto;padding:46px 12px 60px;text-align:center}
#hud{display:flex;justify-content:space-between;align-items:center;background:#fffffff0;border-radius:16px;padding:6px 14px;font-size:20px;margin-bottom:10px}
h1{margin:6px 0;font-size:clamp(26px,7vw,38px);color:#fff;text-shadow:0 3px 0 #15361f}
.t{font-size:clamp(18px,5vw,23px);margin:6px 0 12px;background:#fffffff0;border-radius:18px;padding:8px 14px;display:inline-block;line-height:1.5}
.card{background:#fffffff5;border-radius:22px;padding:14px;margin:10px 0;font-size:clamp(17px,4.6vw,21px);line-height:1.8;text-align:right}
.card b{color:#d6246e}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.btn{font:inherit;font-size:22px;border:0;border-radius:40px;padding:11px 28px;background:#ffb703;color:#15361f;box-shadow:0 6px 0 #b27f00;cursor:pointer;margin:8px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b27f00}
.btn.g{background:#0b8f3c;color:#fff;box-shadow:0 6px 0 #065c27}
.ex{display:inline-block;background:#e8f5e9;border:3px solid #0b8f3c;border-radius:14px;padding:0 12px;margin:3px;cursor:pointer;font-size:24px}
.ex.w{background:#fff3cd;border-color:#ffb703}
.ball{width:clamp(150px,45vw,200px);height:clamp(150px,45vw,200px);margin:6px auto 14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#e6e6e6);border:6px solid #15361f;display:flex;align-items:center;justify-content:center;font-size:clamp(34px,10vw,52px);color:#15361f;box-shadow:0 8px 0 #0004;padding:8px;line-height:1.2}
.ball.s{width:auto;height:auto;border-radius:22px;font-size:clamp(20px,5.2vw,26px);padding:14px 16px;max-width:100%}
.opt{font:inherit;font-size:clamp(20px,5.5vw,26px);min-width:120px;border:0;border-radius:18px;padding:12px 18px;background:#fff;color:#15361f;box-shadow:0 5px 0 #0006;cursor:pointer}
.opt.ok{background:#2ecc71;color:#fff}
.opt.no{background:#e03131;color:#fff}
#fb{min-height:60px;font-size:20px;background:#fffffff0;border-radius:16px;padding:8px 12px;margin-top:10px;display:none;line-height:1.6}
.zone{width:46%;min-height:150px;background:#fffffff0;border:5px dashed #fff;border-radius:20px;padding:6px;font-size:20px;color:#065c27;outline:4px solid #15361f55}
.zone h3{margin:2px 0 6px;font-size:21px}
.zone.w h3{color:#b27f00}
.zone span{display:inline-block;background:#d3f9d8;border-radius:10px;padding:0 8px;margin:2px;font-size:20px}
.chip{background:#fff;border:4px solid #15361f;border-radius:16px;padding:6px 16px;font-size:26px;cursor:grab;touch-action:none;position:relative;z-index:5}
.chip.up{z-index:50;box-shadow:0 10px 18px #0006}
.cn{position:relative;display:flex;justify-content:space-between;padding:0 6px}
.col{display:flex;flex-direction:column;gap:14px;z-index:2;align-items:stretch}
.it{font:inherit;background:#fff;border:4px solid #15361f;border-radius:16px;padding:8px 6px;font-size:22px;line-height:1.3;min-height:64px;cursor:pointer;color:#15361f}
.it.l{width:96px;font-size:30px}.it.r{width:150px;font-size:18px}
.it.sel{background:#fff3bf;transform:scale(1.06)}.it.done{background:#d3f9d8;border-color:#0b8f3c}
#ln{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.goal{position:fixed;top:30%;left:0;right:0;font-size:clamp(50px,16vw,90px);color:#fff;text-shadow:0 5px 0 #15361f;z-index:90;pointer-events:none;animation:gl 1.3s forwards}
@keyframes gl{0%{transform:scale(.2);opacity:0}30%{transform:scale(1.1);opacity:1}100%{transform:scale(1.4);opacity:0}}
.fall{position:fixed;top:-40px;font-size:32px;z-index:80;pointer-events:none;animation:fl 2.2s linear forwards}
@keyframes fl{to{transform:translateY(110vh) rotate(360deg)}}
.big{font-size:84px}
#cr{font-size:13px;color:#fffc;margin-top:24px}
@media (prefers-reduced-motion:reduce){.fall,.goal{animation-duration:.01s}}
</style>
</head>
<body>
<div id="stands">🧑👦👧👨👩🧔🧒🧑👦👧👨👩🧔🧒🧑👦👧👨👩🧔🧒🧑👦👧👨👩🧔🧒</div>
<div id="app"><div id="hud"><span>🏟️ ملعب الهمزات</span><span id="sc">⚽ 0</span></div><div id="st"></div><div id="cr">تصميم: T.Badria Alfalahi</div></div>
<script>
const st=document.getElementById('st'),sc=document.getElementById('sc');
let ac=null,score=0,step=0;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const sh=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const PR=['أحسنت يا عمر!','هدف رائع يا عمر!','بطل يا عمر!','ممتاز يا بطل!','رائع يا عمر!'];
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';u.rate=.8;speechSynthesis.speak(u)}catch(e){}}
function tone(fs,d,type,v){if(!ac)return;fs.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*d;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d*1.2);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d*1.3)})}
function crowd(n){if(!ac)return;for(let i=0;i<n;i++){const t=ac.currentTime+i*.06,b=ac.createBuffer(1,3000,ac.sampleRate),d=b.getChannelData(0);for(let j=0;j<d.length;j++)d[j]=(Math.random()*2-1)*Math.pow(1-j/d.length,2);const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=b;f.type='bandpass';f.frequency.value=700+Math.random()*2000;g.gain.value=.45;s.connect(f);f.connect(g);g.connect(ac.destination);s.start(t)}}
function whistle(){tone([1800,1500],.18,'sine',.15)}
function confetti(){for(let i=0;i<20;i++){const s=document.createElement('span');s.className='fall';s.textContent=pick(['⚽','⭐','🎉','🏆']);s.style.left=Math.random()*95+'vw';s.style.animationDelay=Math.random()*.5+'s';document.body.append(s);setTimeout(()=>s.remove(),3000)}}
function goal(){score++;sc.textContent='⚽ '+score;const g=document.createElement('div');g.className='goal';g.textContent='هــدف! ⚽';document.body.append(g);setTimeout(()=>g.remove(),1400);tone([523,659,784,1047],.1,'triangle',.2);crowd(24);confetti();say(pick(PR))}
function bad(el){whistle();if(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}}
function page(t,b){st.innerHTML=`<div class="t">${t}</div>${b}`}
function go(i){step=i;[start,intro,shoot,teams,connect,fill,var_,end][i]()}
const fb=(h)=>{const f=document.getElementById('fb');f.style.display='block';f.innerHTML=h};

const MAX=8+8+4+6+6;
function start(){score=0;sc.textContent='⚽ 0';st.innerHTML='<h1>ملعب الهمزات 🏟️</h1><div class="t">همزتا القطع والوصل<br>للبطل عمر – الصف الخامس</div><div class="big">⚽🥅</div><br><button class="btn" id="go">ادخل الملعب</button>';
document.getElementById('go').onclick=()=>{ac=ac||new (window.AudioContext||window.webkitAudioContext)();whistle();say('أهلا بالبطل عمر! هيا نتذكر القاعدة');go(1)}}

const SL=[
['⭐ همزة القطع','<b>تُنطق دائماً</b> في أول الكلام وفي وسطه، وتُكتب برأس همزة (أ أو إ).<br>مثل: <span class="ex" data-s="أسد">أسد</span><span class="ex" data-s="إبل">إبل</span><span class="ex" data-s="أكل">أكل</span><br>🧢 تشبه <b>اللاعب الأساسي</b>: لا يغادر الملعب أبداً!'],
['🔄 همزة الوصل','<b>تُنطق في أول الكلام فقط</b> وتسقط في وسط الكلام، وتُكتب <b>ألفاً بلا رأس همزة</b> (ا).<br>مثل: <span class="ex w" data-s="اسم">اسم</span><span class="ex w" data-s="اكتب">اكتب</span><span class="ex w" data-s="انطلق">انطلق</span><br>🧢 تشبه <b>اللاعب الاحتياطي</b>: يظهر في البداية ويختفي عند الوصل!'],
['🧪 تجربة حرف الواو','ضع <b>الواو</b> قبل الكلمة ثم انطق:<br><span class="ex" data-s="وأكل">وأكل</span> الهمزة تُنطق ← <b>قطع</b><br><span class="ex w" data-s="واكتب">واكتب</span> الهمزة تسقط ← <b>وصل</b>'],
['📋 متى تكون همزة وصل؟','١) <b>أل</b> التعريف: القلم، الكتاب<br>٢) <b>الأسماء العشرة</b>: اسم، ابن، ابنة، امرأة، اثنان، اثنتان…<br>٣) ماضي وأمر ومصدر الفعل <b>الخماسي والسداسي</b>: انطلق، استمع، انطلاق، استماع<br>٤) أمر الفعل <b>الثلاثي</b>: اكتب، اجلس<br>وما عدا ذلك فهمزته <b>قطع</b>: أخ، أنا، إلى، أكرم، إكرام']];
function intro(k){k=k||0;page(SL[k][0]+` (${k+1}/4)`,`<div class="card">${SL[k][1]}</div><button class="btn g" id="n">${k<3?'التالي ◀':'ابدأ المباراة ⚽'}</button>`);
st.querySelectorAll('.ex').forEach(e=>e.onclick=()=>say(e.dataset.s));
document.getElementById('n').onclick=()=>k<3?intro(k+1):go(2)}

function quiz(title,items,after){let i=0,lock=false;
function show(){lock=false;const it=items[i];page(`${title} (${i+1}/${items.length})`,`<div class="ball${it.s?' s':''}">${it.q}</div><div class="row">${it.o.map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join('')}</div><div id="fb"></div>`);
const bs=st.querySelectorAll('.opt');
bs.forEach(b=>b.onclick=()=>{if(lock)return;lock=true;const ok=+b.dataset.k==it.a;bs[it.a].classList.add('ok');
if(ok){goal();fb('✅ '+it.r);setTimeout(nx,2000)}
else{b.classList.add('no');bad(b);say('حاول مرة أخرى');fb('🟥 الإجابة الصحيحة: '+it.o[it.a]+'<br>'+it.r+'<br><button class="btn g" id="nx">التالي ◀</button>');document.getElementById('nx').onclick=nx}})}
function nx(){if(++i>=items.length)after();else show()}show()}

const SW=[['أسد',0,'اسم همزته قطع'],['ابنة',1,'من الأسماء العشرة'],['إبل',0,'اسم همزته قطع'],['انطلق',1,'فعل ماضٍ خماسي'],['أرسل',0,'فعل ماضٍ رباعي'],['القلم',1,'همزة أل التعريف'],['إكرام',0,'مصدر الفعل الرباعي'],['اكتب',1,'فعل أمر ثلاثي']];
function shoot(){say('سدد الكرة! ما نوع الهمزة؟');quiz('⚽ سدّد الكرة',sh(SW).map(w=>({q:w[0],o:['همزة قطع','همزة وصل'],a:w[1],r:w[2]+' ← '+(w[1]?'وصل':'قطع')})),()=>go(3))}

const TW=[['أخ',0,'اسم همزته قطع'],['اسم',1,'من الأسماء العشرة'],['أنا',0,'ضمير همزته قطع'],['استمع',1,'فعل ماضٍ سداسي'],['أكل',0,'فعل ماضٍ ثلاثي'],['امرأة',1,'من الأسماء العشرة'],['إلى',0,'حرف جر همزته قطع'],['اجلس',1,'فعل أمر ثلاثي']];
function teams(){let n=0;page('🥅 وزّع اللاعبين على الفريقين','<div class="row"><div class="zone" data-k="0"><h3>⭐ فريق القطع</h3></div><div class="zone w" data-k="1"><h3>🔄 فريق الوصل</h3></div></div><div class="row" id="ch" style="margin-top:20px">'+sh(TW).map(w=>`<div class="chip" data-w="${w[0]}">${w[0]}</div>`).join('')+'</div><div id="fb"></div>');
st.querySelectorAll('.chip').forEach(ch=>{let sx,sy,on=false;const w=TW.find(x=>x[0]==ch.dataset.w);
ch.onpointerdown=e=>{on=true;sx=e.clientX;sy=e.clientY;ch.setPointerCapture(e.pointerId);ch.classList.add('up')};
ch.onpointermove=e=>{if(on)ch.style.transform=`translate(${e.clientX-sx}px,${e.clientY-sy}px) scale(1.15)`};
ch.onpointerup=e=>{if(!on)return;on=false;ch.style.visibility='hidden';const t=document.elementFromPoint(e.clientX,e.clientY);ch.style.visibility='';ch.classList.remove('up');const z=t&&t.closest('.zone');
if(!z){ch.style.transform='';return}
if(+z.dataset.k==w[1]){const s=document.createElement('span');s.textContent=w[0];z.append(s);ch.remove();goal();fb('✅ '+w[2]);if(++n==TW.length)setTimeout(()=>go(4),2200)}
else{ch.style.transform='';bad(z);say('حاول مرة أخرى');fb('🟥 '+w[0]+' ليست في هذا الفريق، فكّر: '+w[2].split(' ')[0]+'…')}}})}

const CN=[['ابن','اسم من الأسماء العشرة'],['اكتب','فعل أمر ثلاثي'],['انطلق','فعل ماضٍ خماسي'],['القلم','أل التعريف']];
function connect(){let sel=null,n=0;page('🔗 وصّل الكلمة بسبب همزة الوصل','<div class="cn"><svg id="ln"></svg><div class="col">'+CN.map(c=>`<button class="it l" data-c="${c[0]}" data-s="a">${c[0]}</button>`).join('')+'</div><div class="col">'+sh(CN).map(c=>`<button class="it r" data-c="${c[0]}" data-s="b">${c[1]}</button>`).join('')+'</div></div><div id="fb"></div>');
const cn=st.querySelector('.cn'),svg=document.getElementById('ln');
st.querySelectorAll('.it').forEach(b=>b.onclick=()=>{if(b.classList.contains('done'))return;
if(!sel||sel.dataset.s==b.dataset.s){if(sel)sel.classList.remove('sel');sel=b;b.classList.add('sel');return}
if(sel.dataset.c==b.dataset.c){const r=cn.getBoundingClientRect(),a=sel.getBoundingClientRect(),c=b.getBoundingClientRect(),l=document.createElementNS('http://www.w3.org/2000/svg','line');
l.setAttribute('x1',a.left+a.width/2-r.left);l.setAttribute('y1',a.top+a.height/2-r.top);l.setAttribute('x2',c.left+c.width/2-r.left);l.setAttribute('y2',c.top+c.height/2-r.top);l.setAttribute('stroke','#ffb703');l.setAttribute('stroke-width','8');l.setAttribute('stroke-linecap','round');svg.append(l);
sel.classList.remove('sel');sel.classList.add('done');b.classList.add('done');sel=null;goal();if(++n==4)setTimeout(()=>go(5),2200)}
else{const o=sel;o.classList.remove('sel');sel=null;bad(b);say('حاول مرة أخرى');fb('🟥 ليست الإجابة الصحيحة، حاول مرة أخرى')}})}

const FL=[['___كل عمر الغداء بعد المباراة',0,'أكل: فعل ماضٍ ثلاثي ← همزة قطع'],['___جلس يا عمر على مقعد البدلاء',2,'اجلس: فعل أمر ثلاثي ← همزة وصل'],['___خوة عمر يشجعونه في المدرجات',1,'إخوة: اسم ← همزة قطع'],['___ستمع عمر إلى تعليمات المدرب',2,'استمع: فعل ماضٍ سداسي ← همزة وصل'],['___كرم المدرب اللاعبين',0,'أكرم: فعل رباعي ← همزة قطع'],['___سم عمر مكتوب على القميص',2,'اسم: من الأسماء العشرة ← همزة وصل']];
function fill(){say('اختر الحرف المناسب لأول الكلمة');quiz('✏️ أكمل الكلمة',sh(FL).map(f=>({q:f[0],s:1,o:['أ','إ','ا'],a:f[1],r:f[2]})),()=>go(6))}

const VR=[['همزة (أكل) همزة قطع',0,'أكل فعل ماضٍ ثلاثي ← قطع'],['همزة (اسم) همزة قطع',1,'اسم من الأسماء العشرة ← وصل'],['همزة القطع تُنطق في أول الكلام وفي وسطه',0,'القطع تُنطق دائماً'],['همزة الوصل تُنطق في وسط الكلام',1,'الوصل تسقط في وسط الكلام'],['همزة (ال) في (الكتاب) همزة وصل',0,'أل التعريف همزتها وصل'],['همزة (اكتب) همزة قطع',1,'أمر الفعل الثلاثي ← وصل']];
function var_(){say('حَكَم الفيديو يسأل');quiz('🟩 حَكَم الفيديو: صح أم خطأ؟',sh(VR).map(v=>({q:v[0],s:1,o:['صح ✔','خطأ ✘'],a:v[1],r:v[2]})),()=>go(7))}

function end(){const m=score>=MAX*.85?['🥇','الميدالية الذهبية']:score>=MAX*.6?['🥈','الميدالية الفضية']:['🥉','الميدالية البرونزية'];
st.innerHTML=`<h1>صافرة النهاية! 🏁</h1><div class="big">🏆${m[0]}</div><div class="t">هدّاف البطولة: البطل عمر<br>سجّلت ${score} من ${MAX} هدفاً<br>${m[1]}</div><br><button class="btn" id="re">مباراة جديدة 🔁</button>`;
goal();score--;sc.textContent='⚽ '+score;crowd(40);say('أحسنت يا بطل! سجلت '+score+' من '+MAX+' هدفاً');document.getElementById('re').onclick=()=>go(0)}
start();
</script>
</body>
</html>
